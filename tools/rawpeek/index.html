
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>peek your data</title>
  <meta content="RAWPEEK" property="og:title" />
  <meta content="peek your data" property="og:description" />
  <meta content="https://lyra.horse/tools/rawpeek/" property="og:url" />
  <meta content="https://lyra.horse/tools/rawpeek/thumb.png" property="og:image" />
  <meta content="#FF007B" data-react-helmet="true" name="theme-color" />
  <style>
    @font-face {
      font-family: 'VT323';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(VT323-latin.woff2) format('woff2');
    }
    html, body {
      font-variant-ligatures: none;
      font-family: "VT323", monospace;
      font-size: 24px;
      margin: 0;
      width: 100%;
      height: 100%;
      border: 0;
      overflow: hidden;
      color: #FFF;
    }
    canvas, img {
      image-rendering: pixelated;
      position: absolute;
      font-kerning: none;
    }
    #bgCanvas {
      filter: blur(24px);
    }
    #mainCanvas {
      z-index: 1;
    }
    #menubar {
      position: absolute;
      background: #290033;
      z-index: 2;
      padding: 12px;
      width: calc(100% - 48px - 24px);
      height: calc(48px - 24px);
      top: 24px;
      left: 24px;
      line-height: 0;
      display: flex;
      align-items: center;
      column-gap: 10px;
      cursor: default;
      user-select: none;
    }
    #sidebarDiv {
      position: absolute;
      background: #290033;
      z-index: 2;
      padding: 12px;
      width: calc(256px - 24px);
      height: calc(100% - 72px - 48px - 24px);
      right: 24px;
      bottom: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .historyEntry {
      word-break: break-all;
      white-space: pre-wrap;
    }
    /*
    .currentEntry {
      color: #FAA;
    }
    */
    .historyEntry button, #menubar button {
      background: none;
      border: none;
      font-size: inherit;
      font-family: inherit;
      color: inherit;
      cursor: pointer;
    }
    .historyEntry button {
      padding: 0 2px;
      text-decoration: underline;
    }
    .help {
      color: #AAA;
      font-size: 16px;
      margin: auto 0 0 0;
      align-self: flex-end;
    }
    #menubar button {
      padding: 0 2px;
    }
    #menubar a {
      color: inherit;
      text-decoration: inherit;
      cursor: pointer;
    }
    h1 {
      color: #FAA;
      padding: 0 2px;
      margin: 0;
      text-transform: uppercase;
      font-size: inherit;
      display: inline-block;
      font-weight: normal;
    }
    #status {
      margin-left: auto;
      text-transform: uppercase;
    }
    #imgInput {
      display: none;
    }
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="mainCanvas"></canvas>
<div id="menubar"><h1>RAWPEEK</h1>
  <button onclick="imgInput.click()" onmouseenter="setStatus(`Open an image or project`)" onmouseleave="clearStatus()">OPEN</button>/
  <button onclick="cycleMode()" onmouseenter="setStatus(`Cycle through display modes`)" onmouseleave="clearStatus()">MODE</button>/
  <button onclick="resetTempSize()" onmouseenter="setStatus(`Restore original dimension`)" onmouseleave="clearStatus()">RESTORE</button>
  <span id="status"></span></div>
<div id="sidebarDiv"></div>
<input id="imgInput" type="file" />
<script>
  const status = document.getElementById("status");
  const sidebarDiv = document.getElementById("sidebarDiv");
  const mainCanvas = document.getElementById("mainCanvas");
  const bgCanvas = document.getElementById("bgCanvas");
  let ctx = mainCanvas.getContext("2d");
  let btx = bgCanvas.getContext("2d");
  let modificationHistory = [];
  let currentModification = null;
  let originalFile = null;
  let currentFile = null;
  let currentImage = null;
  let currentCorruptedFile = null;
  let currentCorruptedImage = null;
  let lastWasError = false;
  let errorStack = [0];
  let errorStackIndex = 0;
  let errorStackPos = -1;
  let lastEditIndex = -1;

  const PRESENT_1PPB = 0;
  const PRESENT_8PPB = 1;
  const PRESENT_3BPP = 2;
  const PRESENT_4BPP = 3;
  let dataPresentMode = PRESENT_3BPP;
  let mouseDataTempIndex = -1;
  let glitchWidthTemp = -1;
  let glitchHeightTemp = -1;

  function resizeCanvas() {
    ctx.canvas.width  = window.innerWidth;
    ctx.canvas.height = window.innerHeight;
    btx.canvas.width  = window.innerWidth;
    btx.canvas.height = window.innerHeight;
    btx.globalAlpha = 1;
  }

  let lastMouseX = 0;
  let lastMouseY = 0;
  function handleMouseMove(e) {
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    mouseDataTempIndex = -1;
    updateDataPos();
    //corrupt(1);
  }

  function handleMouseWheel(e) {
    if (e.ctrlKey)
      e.preventDefault();
    (altDown?resizeTempWidth:moveTempIndex)(e.deltaY > 0 ? 1 : -1);
  }

  function moveTempIndex(dir) {
    if (mouseDataTempIndex == -1) mouseDataTempIndex = getMouseDataIndex();
    mouseDataTempIndex += dir*(ctrlDown?8:1)*(dataPresentMode==PRESENT_8PPB?8:1);
    updateDataPos();
  }

  function resetTempSize() {
    glitchWidthTemp = -1;
    glitchHeightTemp = -1;
  }

  function resizeTempWidth(dirX, dirY) {
    if (glitchWidthTemp == -1) {
      const {glitchbox} = getLayout();
      glitchWidthTemp = glitchbox[2];
      glitchHeightTemp = glitchbox[3];
    }
    glitchWidthTemp += dirX*(shiftDown?8:1)*(ctrlDown?1:8);
    if (dirY) {
      glitchHeightTemp += dirY*(shiftDown?8:1)*(ctrlDown?1:8);
    }
    setStatus(`[${glitchWidthTemp}x${glitchHeightTemp}]`);
  }

  function cycleMode() {
    dataPresentMode = (dataPresentMode + 1) % 4;
    switch (dataPresentMode) {
        case PRESENT_1PPB:
            return setStatus(`mode -> 1 pixel per byte`);
        case PRESENT_8PPB:
            return setStatus(`mode -> 8 pixels per byte`);
        case PRESENT_3BPP:
            return setStatus(`mode -> 3 bytes per pixel`);
        case PRESENT_4BPP:
            return setStatus(`mode -> 4 bytes per pixel`);
    }
  }

  let shiftDown = false;
  let ctrlDown = false;
  let altDown = false;
  function handleKeyDown(e) {
    if (altDown) e.preventDefault();
    switch(e.key) {
      case "ArrowLeft":
        (altDown?resizeTempWidth:moveTempIndex)(-1);
        break;
      case "ArrowDown":
        if (altDown) {
          resizeTempWidth(0,1);
        }
        break;
      case "ArrowRight":
        (altDown?resizeTempWidth:moveTempIndex)(1);
        break;
      case "ArrowUp":
        if (altDown) {
          resizeTempWidth(0,-1);
        }
        break;
      case "Shift":
        if (!shiftDown) {
          calculateZoomOffset();
          shiftDown = true;
        }
        break;
      case "Alt":
        if (!altDown)
          altDown = true;
        break;
      case "Control":
        if (!ctrlDown)
          ctrlDown = true;
        break;
    }
  }
  function handleKeyUp(e) {
    switch(e.key) {
      case "Shift":
        shiftDown = false;
        zoomProgress = 0;
        break;
      case "Alt":
        altDown = false;
        break;
      case "Control":
        ctrlDown = false;
        break;
    }
  }

  function arr2img(arr) {
    return window.URL.createObjectURL(new Blob([arr], { type: imageMime }));
  }

  document.body.ondragover = (ev) => ev.preventDefault();
  document.body.ondrop = async (ev) => {
    ev.preventDefault();
    for (const img of (ev.dataTransfer.items) ? [...ev.dataTransfer.items].filter(item => item.kind === "file").map(item => item.getAsFile()) : [...ev.dataTransfer.files]) {
      await loadImage(img);
    }
  };
  imgInput.addEventListener("change", async () => {
    if (imgInput.files.length >= 1) {
      for (const img of imgInput.files) {
        loadImage(img);
      }
    }
  });

  let zoomOffset = 0;
  let zoomAmount = 1;
  let zoomProgress = 1;
  function calculateZoomOffset() {
    const touchArea = getLayout().glitchbox;
    const mouseDataIndex = getMouseDataIndex(touchArea, true);
    const pixelCount = touchArea[2]*touchArea[3];
    if (getDataCount() < 128) {
      zoomOffset = 0;
      zoomAmount = 1;
      return;
    }
    zoomAmount = 16;
    while (Math.floor(pixelCount/zoomAmount)*2 >= getDataCount())
      zoomAmount *= 2;
    zoomOffset = 0;
    shiftDown = true;
    const zoomedMouseDataIndex = getMouseDataIndex(touchArea, true);
    const zoomedDataCount = Math.floor(pixelCount/zoomAmount);
    zoomOffset = mouseDataIndex - zoomedMouseDataIndex;
    zoomOffset = Math.min(Math.max(zoomOffset, 0), getDataCount()-zoomedDataCount);
    zoomProgress = 0;
  }

  function setStatus(text, color) {
    status.innerText = text;
    status.style.color = color ?? "#FFF";
  }

  function clearStatus() {
    status.innerText = "";
  }

  let imageMime = "image/jpeg";
  let imageFilename = "arrupted.jpg";
  async function loadImage(img) {
    if (img?.name?.endsWith(".arrupt")) {
      loadProj(img);
      return;
    }
    imageFilename = img?.name ? `arrupted_${img.name}` : "arrupted.jpg"
    //imageMime = img?.type?.includes("image/") ? img.type : "image/jpeg";
    imageMime = img?.type ? img.type : "unknown";
    setStatus(img?.type ? `wowie, a ${img.type}!` : `let's go!`);
    fileChunks = [];
    const buff = await img.arrayBuffer();
    originalFile = new Uint8Array(buff);
    currentFile = new Uint8Array(buff);
    currentImage = new Image();
    currentImage.src = arr2img(currentFile);
    currentCorruptedImage = currentImage;
    currentCorruptedFile = currentFile;
    

    modificationHistory = [];
    currentModification = null;
    updateDom();
  }

  function handleMouseClick() {
    const mouseDataIndex = getMouseDataIndex();
    if (mouseDataIndex >= 0 && !lastWasError && currentCorruptedFile && currentModification) {
      modificationHistory.push(currentModification);
      currentModification = null;
      //applyModifications();
    }
  }

  function getMouseDataIndex(existingTouchArea, ignoreTempIndex) {
    if (mouseDataTempIndex != -1 && !ignoreTempIndex) return mouseDataTempIndex;
    const touchArea = existingTouchArea || getLayout().glitchbox;
    const pixelCount = touchArea[2]*touchArea[3];
    const dataCount = shiftDown ? Math.min(getDataCount(), Math.floor(pixelCount/zoomAmount)) : getDataCount();
    const mouseInnerX = lastMouseX - touchArea[0];
    const mouseInnerY = lastMouseY - touchArea[1];
    const yReduce = Math.floor(Math.sqrt(pixelCount/dataCount)) || 1;
    const yFactor = Math.floor(touchArea[3]/yReduce)/(touchArea[3]/yReduce);
    let mouseDataIndex = -1;
    if (mouseInnerX >= 0 && mouseInnerY >= 0 && mouseInnerX < touchArea[2] && mouseInnerY < touchArea[3]) {
     mouseDataIndex = Math.floor((mouseInnerX + Math.floor((mouseInnerY+1)/yReduce*yFactor)*touchArea[2])*(dataCount/pixelCount)*yReduce/yFactor) + (shiftDown ? zoomOffset : 0);
    }
    return mouseDataIndex;
  }

  function randomByte() {
    return Math.floor(Math.random()*256);
  }

  function updateSidebar() {
    let sidebarText = '';
    const fileSizeBits = Math.log2(currentFile.length);
    let addrPadding = 8;
    while (addrPadding < fileSizeBits/4) addrPadding*=2;
    if (!currentModification) {
      sidebarText += `[:3]\n`;
      sidebarText += `fn: ${imageFilename}\n`;
      sidebarText += `len: 0x${currentFile.length.toString(16).padStart(addrPadding, '0')}\n`;
      sidebarText += `    (${currentFile.length} bytes)\n`;
      sidebarText += `mime: ${imageMime}\n`;
    } else {
      let fileIndex = getFileIndex();
      try {
        let shortAligned = Math.floor(fileIndex/2)*2;
        let intAligned = Math.floor(fileIndex/4)*4;
        sidebarText += `0x${currentModification[0].toString(16).padStart(addrPadding, '0')}\n`;
        sidebarText += `> ${[...currentFile.slice(intAligned,intAligned+4)].map(e=>e.toString(16).padStart(2, '0')).join(' ')} <\n`;
        sidebarText += `[little align]\n`;
        sidebarText += `c: ${currentFile[fileIndex]} (0x${currentFile[fileIndex].toString(16).padStart(2, '0')})\n`;
        sidebarText += `s: ${currentFile[shortAligned]+(currentFile[shortAligned+1]<<8)}\n`;
        sidebarText += `i: ${currentFile[intAligned]+(currentFile[intAligned+1]<<8)+(currentFile[intAligned+2]<<16)+(currentFile[intAligned+3]<<24)}\n`;
        sidebarText += `[big align]\n`;
        sidebarText += `c: ${currentFile[fileIndex]} (0x${currentFile[fileIndex].toString(16).padStart(2, '0')})\n`;
        sidebarText += `s: ${currentFile[shortAligned+1]+(currentFile[shortAligned]<<8)}\n`;
        sidebarText += `i: ${currentFile[intAligned+3]+(currentFile[intAligned+2]<<8)+(currentFile[intAligned+1]<<16)+(currentFile[intAligned]<<24)}\n`;
        sidebarText += `[little]\n`;
        sidebarText += `c: ${currentFile[fileIndex]} (0x${currentFile[fileIndex].toString(16).padStart(2, '0')})\n`;
        sidebarText += `s: ${currentFile[fileIndex]+(currentFile[fileIndex+1]<<8)}\n`;
        sidebarText += `i: ${currentFile[fileIndex]+(currentFile[fileIndex+1]<<8)+(currentFile[fileIndex+2]<<16)+(currentFile[fileIndex+3]<<24)}\n`;
        sidebarText += `[big]\n`;
        sidebarText += `c: ${currentFile[fileIndex]} (0x${currentFile[fileIndex].toString(16).padStart(2, '0')})\n`;
        sidebarText += `s: ${currentFile[fileIndex+1]+(currentFile[fileIndex]<<8)}\n`;
        sidebarText += `i: ${currentFile[fileIndex+3]+(currentFile[fileIndex+2]<<8)+(currentFile[fileIndex+1]<<16)+(currentFile[fileIndex]<<24)}\n`;
      } catch (ignored) {}
    }
    document.querySelector(".currentEntry").innerText = sidebarText;
  }

  function updateDataPos() {
    if (!currentFile) return;
    const mouseDataIndex = getMouseDataIndex();
    if (mouseDataIndex === -1) {
      if (currentModification) {
        currentModification = null;
        updateSidebar();
      }
      return;
    }

    currentModification = [mouseDataIndex, -1, false];
    updateSidebar();
  }


  let imageRatio = 1;
  function getLayout(barsOnly) {
    const p = 24; // padding
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const menubar = [p, p, w-p*2, 48];
    const sidebar = [w-256-p, p*2+menubar[3], 256, h-p*3-menubar[3]];
    if (barsOnly) return { menubar, sidebar };
    const mainHeight = h - menubar[3] - p*3;
    const mainWidth = w - sidebar[2] - p*3;
    const maxImgWidth = Math.floor((mainWidth-p)*0.75);
    if (currentImage) {
      imageRatio = currentImage.naturalWidth/currentImage.naturalHeight || imageRatio;
    }
    //const imagebox = [p, 2*p+menubar[3], Math.floor(imageRatio*mainHeight), mainHeight];
    //if (imagebox[2] > maxImgWidth) {
    //  imagebox[2] = maxImgWidth;
    //  imagebox[3] = Math.floor(maxImgWidth/imageRatio);
    //  imagebox[1] += Math.floor((mainHeight - imagebox[3])/2);
    //}
    const glitchbox = [p*2, 2*p+menubar[3], glitchWidthTemp!=-1?glitchWidthTemp:Math.max(1, mainWidth - p), glitchWidthTemp!=-1?glitchHeightTemp:Math.max(1, mainHeight)];
    return {
      menubar,
      sidebar,
      //imagebox,
      glitchbox,
    };
  }

  function mod2txt(mod) {
    if (!mod) return "\u200b";
    return `${mod[0].toString(16).padStart(6, '0')} > ${mod[1].toString(16).padStart(2, '0')}`.replace(/f/g, "f\u200b");
  }

  function updateDom() {
    lastEditIndex = -1;
    sidebarDiv.innerText = "";
    let i = 0;
    for (const modification of [...modificationHistory, currentModification] ) {
      const entry = document.createElement("div");
      const isCurrent = modification === currentModification;
      entry.innerText = mod2txt(modification);
      entry.classList.add("historyEntry");
      if (isCurrent) entry.classList.add("currentEntry");
      if (!isCurrent) {
        const entryIndex = i;
        const buttons = document.createElement("span");
        const editBtn = document.createElement("button");
        const visBtn = document.createElement("button");
        const delBtn = document.createElement("button");
        editBtn.innerText = "edit";
        editBtn.onclick = () => editEntry(entryIndex);
        editBtn.onwheel = (e) => editEntryScroll(entryIndex, (e.deltaY < 0 ? 1 : -1)*(shiftDown ? 4 : 1));
        editBtn.onmouseenter = () => lastEditIndex = entryIndex;
        editBtn.onmouseleave = () => lastEditIndex = -1;
        visBtn.innerText = modification[2] ? "show" : "hide";
        visBtn.onclick = () => visEntry(entryIndex);
        delBtn.innerText = "x";
        delBtn.onclick = () => delEntry(entryIndex);
        [editBtn, visBtn, delBtn].forEach(b => buttons.appendChild(b));
        buttons.style.float = "right";
        entry.appendChild(buttons);
      }
      sidebarDiv.appendChild(entry);
      i++;
    }
    const help = document.createElement("div");
    help.classList.add("help");
    help.innerText = `\
IYKYK :3
(based on Arrupted)

Scroll - Move 
Arrow keys - Same thing
Ctrl - Move faster
Shift - Zoom in
Alt+Arrow - Resize view

Processing is done locally, no data is sent to the server.`;
    sidebarDiv.appendChild(help);
    if (modificationHistory.length && sidebarDiv.scrollHeight > sidebarDiv.clientHeight)
      sidebarDiv.removeChild(help);
  }

  function getCurrentFileData(dataIndex) {
    switch (dataPresentMode) {
        case PRESENT_1PPB:
            return [currentFile[dataIndex]];
        case PRESENT_8PPB:
            return [((currentFile[Math.floor(dataIndex/8)] >> (8-(dataIndex%8)))&1)*255];
        case PRESENT_3BPP:
            return [currentFile[dataIndex*3],currentFile[dataIndex*3+1],currentFile[dataIndex*3+2]];
        case PRESENT_4BPP:
            return [currentFile[dataIndex*3],currentFile[dataIndex*3+1],currentFile[dataIndex*3+2],currentFile[dataIndex*3+3]];
    }
  }

  function getDataCount() {
    switch (dataPresentMode) {
        case PRESENT_1PPB:
            return currentFile.length;
        case PRESENT_8PPB:
            return currentFile.length*8;
        case PRESENT_3BPP:
            return Math.floor(currentFile.length/3);
        case PRESENT_4BPP:
            return Math.floor(currentFile.length/4);
    }
  }

  function getFileIndex() {
    const mouseDataIndex = getMouseDataIndex();
    switch (dataPresentMode) {
        case PRESENT_1PPB:
            return mouseDataIndex;
        case PRESENT_8PPB:
            return Math.floor(mouseDataIndex/8);
        case PRESENT_3BPP:
            return mouseDataIndex*3;
        case PRESENT_4BPP:
            return mouseDataIndex*4;
    }
  }

  // temp
  //dataPresentMode = PRESENT_8PPB;

  let lastDelta = 0;
  function render(delta) {
    try {
    const layout = getLayout();
    const touchArea = layout.glitchbox;

    btx.drawImage(mainCanvas, -layout.glitchbox[0]*4, -ctx.canvas.height, ctx.canvas.width*3, ctx.canvas.height*3);
    btx.globalAlpha = 0.02;

    ctx.fillStyle = "white";
    ctx.fillStyle = "#FFF1";
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);


    
    if (currentFile) {
      const pixelCount = touchArea[2]*touchArea[3];
      const dataCount = shiftDown ? Math.min(getDataCount(), Math.floor(pixelCount/zoomAmount)) : getDataCount();
      const yReduce = Math.floor(Math.sqrt(pixelCount/dataCount)) || 1;
      const yFactor = Math.floor(touchArea[3]/yReduce)/(touchArea[3]/yReduce);
      const rawImageData = ctx.createImageData(touchArea[2], touchArea[3]);
      const mouseDataIndex = getMouseDataIndex(touchArea);
      

      const data = rawImageData.data;
      const iterCount = Math.min(dataCount, pixelCount);
      const lotsOfData = dataCount > pixelCount;
      const xReduce = lotsOfData ? 1 : (Math.floor(pixelCount/dataCount/yReduce)+1);
      for (let v = 0; v < iterCount; v++) {
        const i = Math.ceil((v/iterCount)*(pixelCount/yReduce));
        const i2 = Math.floor(i*yFactor);
        const x = i2%touchArea[2];
        const y = Math.floor(i2/touchArea[2]);
        let dataIndex = Math.floor((i*yReduce)*(dataCount/pixelCount)) + (shiftDown ? zoomOffset : 0);
        let currentData;
        if (!lotsOfData) {
          currentData = getCurrentFileData(dataIndex);
        }
        const mDataIndex = Math.floor((i*yReduce)*(dataCount/pixelCount)) + (shiftDown ? zoomOffset : 0);
        //const isPngChunk = fileChunks[dataIndex];
        for (let xr = 0; xr < xReduce; xr++) {
          for (let yr = 0; yr < yReduce/yFactor; yr++) {
            let cY = y;
            let cX = x+xr;
            if (cX >= touchArea[2]) {
              cX -= touchArea[2];
              cY += 1;
            }
            const pix =(cX+Math.floor((cY*yReduce/yFactor+yr))*touchArea[2])*4;
            for (let j = 0; j < 3; j++) {
              if (lotsOfData) {
                dataIndex = Math.floor((i*yReduce*3+j)*(dataCount/pixelCount/3)) + (shiftDown ? zoomOffset : 0);
                currentData = getCurrentFileData(dataIndex);
                data[pix+j] = currentData[j%currentData.length];
              } else {
                data[pix+j] = currentData[j%currentData.length];
              }
            }
            /*
            if (isPngChunk) {
              data[pix+1] = Math.max(0, data[pix+2] - 128);
              data[pix+2] = data[pix+2] + 128 % 256;
            }
            */
            let chunkSizeMod = [1,1/8,3,4][dataPresentMode];
            if (Math.floor(mouseDataIndex/64*chunkSizeMod) == Math.floor(mDataIndex/64*chunkSizeMod)) {
                let chunkSize = 8;
                while (chunkSize <= 64) {
                    if (Math.floor(mouseDataIndex/chunkSize*chunkSizeMod) == Math.floor(mDataIndex/chunkSize*chunkSizeMod)) {
                      //const colorAmount = (chunkSize*chunkSize)/32;
                      const colorAmount = Math.min(chunkSize*2-32,72);
                      if (chunkSize <= 8)
                        data[pix+1] = Math.max(0, data[pix+2] - (128-colorAmount));
                      data[pix+2] = data[pix+2] + (128-colorAmount) % 256;
                      break;
                    }
                    chunkSize *= 2;
                }
            }
            if (mouseDataIndex == mDataIndex || (dataPresentMode==PRESENT_8PPB && Math.floor(mouseDataIndex/8) == Math.floor(mDataIndex/8))) {
              data[pix] = 255;
              data[pix+1] = 0;
            }
            data[pix+3] = 255;
          }
        }
      }

      ctx.putImageData(rawImageData, touchArea[0], touchArea[1]);
      if (zoomProgress < 1 && delta && !altDown) {
        const zoomMult = 0.05*(Math.pow(1 - zoomProgress, 5))*(shiftDown ? 1 : -1);
        if (zoomMult) {
          ctx.drawImage(ctx.canvas, lastMouseX*zoomMult, lastMouseY*zoomMult, ctx.canvas.width*(1-zoomMult), ctx.canvas.height*(1-zoomMult));
        }
        zoomProgress += (delta-lastDelta)/100;
      }
      
    }
    } catch (e) {
      console.error(e);
    }
    if (delta > 0) lastDelta = delta;
    if (delta !== -1)
      requestAnimationFrame(render);
  }

  window.onload = () => {
    window.addEventListener('resize', resizeCanvas, false);
    window.addEventListener('mousemove', handleMouseMove, false);
    window.addEventListener('click', handleMouseClick, false);
    window.addEventListener('keydown', handleKeyDown, false);
    window.addEventListener('keyup', handleKeyUp, false);
    window.addEventListener('wheel', handleMouseWheel, { passive: false });
    resizeCanvas();
